# PNI Project Configuration Manifest (.pni/pni.toml)
# Precedence: CLI / Workflow step `with:` > Workflow YAML > .pni/pni.toml > Built-in defaults

[project]
name = "mybatis3"
archetypes = ["library"]

[targets]
root = "."
source = ["src/main/java"]
tests = ["src/test/java"]
docs = ["README.md"]
exclude = [
    "reports/**",
    "reports_src/**",
    "pni501_src/**",
    "docs/**",
    "docs_src/**",
    "user_guide_src/**",
    "api_src/**",
    "architecture_src/**",
]

[scan]
respect_gitignore = true
include_gitignored = ["dependencies-lock.json"]
skip_files = [".env", ".env.*", "**/.env"]
skip_dirs = ["reports", "reports_src", "pni501_src", "docs", "docs_src", "user_guide_src", "api_src", "architecture_src"]

[report]
src_dir = "."
output_dir = "docs/pni501"
html_output_dir = "docs/pni501"
formats = ["pdf", "html"]
lang = "en"
style = "google"

# Declarative design waivers for framework-specific and harness patterns:
[[opt_out]]
id = "DS-0026"
scope = [".pni/dockerfiles/**"]
reason = "Hermetic batch test container exits upon Maven JUnit completion; daemon HEALTHCHECK is not applicable."
